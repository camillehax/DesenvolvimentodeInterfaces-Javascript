<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Calculadora de média de três notas.">
  <title>Calculadora de Média</title>
  <link rel="stylesheet" href="./estilo.css">
  <script src="./script.js" defer></script>
</head>
<body>
  <main class="container">
    <h1 id="titulo">Calculadora de Média</h1>
    <p class="introducao">Informe o nome e as três notas do estudante.</p>
    <p class="instrucao">Digite notas entre 0 e 10.</p>

    <div class="campo">
      <label for="nome">Nome do estudante</label>
      <input id="nome" type="text" autocomplete="name"
             placeholder="Ex.: Mariana">
    </div>

    <div class="campo">
      <label for="nota1">Nota 1</label>
      <input id="nota1" type="number" min="0" max="10" step="0.1"
             inputmode="decimal" placeholder="Ex.: 8">
    </div>

    <div class="campo">
      <label for="nota2">Nota 2</label>
      <input id="nota2" type="number" min="0" max="10" step="0.1"
             inputmode="decimal" placeholder="Ex.: 7">
    </div>

    <div class="campo">
      <label for="nota3">Nota 3</label>
      <input id="nota3" type="number" min="0" max="10" step="0.1"
             inputmode="decimal" placeholder="Ex.: 9">
    </div>

    <button id="calcular" type="button">Calcular média</button>
    <p id="resultado" class="resultado" aria-live="polite" role="status">
      Aguardando dados...
    </p>
  </main>
</body>
</html>
