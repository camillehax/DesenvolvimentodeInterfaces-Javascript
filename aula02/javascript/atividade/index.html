<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de idade</title>
    <link rel="stylesheet" href="estilo.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="container">
        <h1>Verificador de idade</h1>
        <p>Informe sua idade para descobrir se é maior ou menor de idade.</p>

        <label for="idade">Informe sua idade:</label>
        <input type="number" id="idade" min="0" max="120" step="1">

        <button type="button" id="verificar">Verificar</button>

        <p id="resultado">Aguardando informação...</p>
    </main>
</body>
</html>
